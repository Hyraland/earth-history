<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>地球漫步</title>
  <style>
    :root {
      --ink: #fdfaf4;
      --ink-dim: rgba(253, 250, 244, 0.72);
      --panel: rgba(28, 22, 18, 0.46);
      --line: rgba(253, 250, 244, 0.35);
      --accent: #f0b46a;
      --danger: #e0664f;
      --serif: "Songti SC", "Noto Serif SC", "Source Han Serif SC", serif;
      --sans: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1512; color: var(--ink); font-family: var(--sans); }
    #app canvas { display: block; }
    #app::after { content: ""; position: fixed; left: 0; right: 0; top: 0; height: 170px; pointer-events: none;
      background: linear-gradient(rgba(20, 16, 12, 0.34), rgba(20, 16, 12, 0)); }

    #hud { position: fixed; left: 28px; top: 24px; pointer-events: none; text-shadow: 0 1px 12px rgba(0,0,0,0.45); }
    #era { font-size: 13px; letter-spacing: 0.18em; color: var(--ink-dim); }
    #age { font-family: var(--serif); font-size: 44px; font-weight: 600; margin-top: 4px; letter-spacing: 0.02em; }

    #caption { position: fixed; left: 50%; top: 22px; transform: translateX(-50%); width: min(520px, 80vw);
      text-align: center; pointer-events: none; opacity: 0; text-shadow: 0 1px 14px rgba(0,0,0,0.5); }
    #caption-title { font-family: var(--serif); font-size: 24px; font-weight: 600; }
    #caption[data-kind="extinction"] #caption-title { color: #ffd2c4; }
    #caption-desc { font-size: 14px; line-height: 1.7; color: var(--ink-dim); margin-top: 6px; }

    #labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
    .placard { position: absolute; left: 0; top: 0; will-change: transform; }
    .placard-card { position: absolute; top: -40px; left: 56px; width: 300px; padding: 14px 16px 15px;
      background: var(--panel); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.14); border-radius: 10px; }
    .placard-stem { position: absolute; left: 0; top: 0; width: 56px; height: 1px; background: linear-gradient(90deg, transparent, var(--line)); }
    .placard-stem::before { content: ""; position: absolute; left: -3px; top: -3px; width: 7px; height: 7px; border-radius: 50%; background: var(--ink); opacity: 0.8; }
    .placard-head { display: flex; align-items: baseline; gap: 10px; }
    .placard-idx { font-size: 12px; color: var(--accent); font-variant-numeric: tabular-nums; }
    .placard-name { font-family: var(--serif); font-size: 22px; font-weight: 600; }
    .placard-tag { margin-left: auto; font-size: 11px; padding: 2px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink-dim); }
    .placard-latin { font-style: italic; font-size: 12px; color: var(--ink-dim); margin-top: 2px; }
    .placard-meta { font-size: 13px; color: var(--accent); margin-top: 8px; }
    .placard-desc { font-size: 13px; line-height: 1.65; color: var(--ink); margin-top: 6px; opacity: 0.9; }

    #timeline { position: fixed; left: 28px; right: 28px; bottom: 26px; height: 40px; cursor: pointer; }
    #tl-track { position: absolute; left: 0; right: 0; top: 10px; height: 6px; border-radius: 3px; overflow: visible; }
    .tl-seg { position: absolute; top: 0; height: 100%; opacity: 0.9; }
    .tl-seg:first-child { border-radius: 3px 0 0 3px; }
    .tl-dot { position: absolute; top: 50%; width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; padding: 0; border-radius: 50%;
      border: 1.5px solid rgba(20,16,12,0.7); background: var(--ink); cursor: pointer; }
    .tl-dot:hover { transform: scale(1.5); }
    .tl-extinction { width: 3px; height: 16px; margin: -8px 0 0 -1.5px; border-radius: 1px; border: none; background: var(--danger); }
    .tl-event { width: 7px; height: 7px; margin: -3.5px 0 0 -3.5px; border-radius: 1px; transform: rotate(45deg); background: var(--accent); border: none; }
    .tl-event:hover { transform: rotate(45deg) scale(1.5); }
    .tl-tick { position: absolute; top: 14px; transform: translateX(-50%); font-size: 11px; color: var(--ink-dim); white-space: nowrap; text-shadow: 0 1px 6px rgba(0,0,0,0.6); }
    .tl-tick:first-of-type { transform: none; }
    #tl-marker { position: absolute; top: 4px; width: 2px; height: 18px; margin-left: -1px; background: var(--ink); box-shadow: 0 0 8px rgba(255,255,255,0.8); }

    #help { position: fixed; right: 28px; top: 28px; font-size: 12px; color: var(--ink-dim); text-align: right; line-height: 1.8;
      text-shadow: 0 1px 8px rgba(0,0,0,0.5); pointer-events: none; }
    kbd { font-family: var(--sans); font-size: 11px; padding: 1px 6px; border: 1px solid var(--line); border-radius: 4px; }

    #file-hint { position: fixed; inset: 0; display: grid; place-items: center; background: #1a1512; z-index: 10; padding: 16px; }
    #file-hint[hidden] { display: none; }
    .file-hint-card { max-width: 440px; line-height: 1.8; font-size: 14px; color: var(--ink-dim); }
    .file-hint-title { font-family: var(--serif); font-size: 24px; color: var(--ink); margin-bottom: 8px; }
    .file-hint-card b { color: var(--accent); }

    @media (max-width: 640px) {
      #hud { left: 16px; top: 16px; } #age { font-size: 30px; }
      #help { display: none; }
      #caption { top: 96px; }
      #timeline { left: 16px; right: 16px; }
      .placard-card { width: 220px; left: 32px; }
      .placard-stem { width: 32px; }
    }
  </style>
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
    } }
  </script>
</head>
<body>
  <div id="app"></div>
  <div id="labels"></div>
  <div id="hud"><div id="era"></div><div id="age"></div></div>
  <div id="caption"><div id="caption-title"></div><div id="caption-desc"></div></div>
  <div id="help"><kbd>空格</kbd> 暂停 · <kbd>→</kbd> 快进 · <kbd>←</kbd> 后退<br />滚轮拖动时间 · 点击时间轴跳转</div>
  <div id="timeline"><div id="tl-track"></div><div id="tl-marker"></div></div>
  <div id="file-hint" hidden>
    <div class="file-hint-card">
      <div class="file-hint-title">需要通过本地服务器打开</div>
      <p>浏览器不允许直接从文件加载 JS 模块，所以双击 index.html 会是空白。</p>
      <p>请双击同一文件夹里的 <b>start.command</b>，它会启动服务器并自动打开页面；关掉那个终端窗口就会停止。</p>
    </div>
  </div>
  <script>
    if (location.protocol === 'file:') document.getElementById('file-hint').hidden = false;
  </script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
